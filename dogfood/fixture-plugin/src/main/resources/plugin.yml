name: DogfoodFixture
version: '${version}'
main: moe.vitamin.minecraft.dogfood.DogfoodPlugin
description: A deliberately broken plugin, for finding out what VitaminMCP cannot answer.
# Derived from SupportedVersions.FLOOR at build time (docs/design.md §5) — do not hand-edit.
api-version: '${apiVersion}'

commands:
  kit:
    description: Gives the starter kit.
    usage: /kit
  shop:
    description: Opens the shop.
    usage: /shop
  top:
    description: Shows the richest players.
    usage: /top

permissions:
  dogfood.shop:
    description: Allows opening the shop.
    default: op
