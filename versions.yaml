# Versions the matrix runs against.
#
# Adding one is a block here and nothing else (CONTRIBUTING.md invariant 7). Every version is started
# natively from a PaperMC build (docs/design.md §15).
#
# The protocol is deliberately absent. One `bot-runner.jar` carries a backend per protocol and
# picks the right one by asking the server what it speaks, so a version needs nothing here beyond
# the build to download (docs/multi-version.md §2.1). What a *new protocol* needs is a
# `bot/backends/backend-<protocol>` directory: a coordinate, and — only where the library really
# differs — one file.
#
# The floor is 1.21. Below it the agent will not load at all (docs/design.md §5.4).

versions:
  # The oldest supported version, and the widest gap from what the shared bot source is written
  # against: five files differ across it. Whatever else changes, this one must keep working.
  - id: "1.21.1"
    paper: { version: "1.21.1" }

  # 1.21.2 and 1.21.3 share protocol 768.
  - id: "1.21.3"
    paper: { version: "1.21.3" }

  - id: "1.21.4"
    paper: { version: "1.21.4" }

  - id: "1.21.5"
    paper: { version: "1.21.5" }

  - id: "1.21.6"
    paper: { version: "1.21.6" }

  # Shares protocol 772 with 1.21.8, so the same backend drives it. Present to prove that a
  # protocol-named backend really does span versions — if it did not, this entry would fail
  # while the one below passed, and the naming would be a lie.
  - id: "1.21.7"
    paper: { version: "1.21.7" }

  # Pinned to a build rather than tracking latest, so a failure here is about this code rather
  # than about a Paper build that changed underneath it.
  - id: "1.21.8"
    paper: { version: "1.21.8", build: 60 }

# Not listed: 1.21.9 and later changed protocol again and need a sibling backend built against
# the matching MCProtocolLib release. Adding a version without one no longer produces a puzzle,
# though — the runner reports which protocols it carries and which one the server asked for,
# rather than letting "Outdated client!" arrive from the server three layers away.
